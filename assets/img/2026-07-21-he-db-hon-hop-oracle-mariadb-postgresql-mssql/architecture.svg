<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 940" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 22px; font-weight: 700; }
    .h2    { font-size: 17px; font-weight: 700; }
    .sub   { font-size: 13px; }
    .bt    { font-size: 14px; font-weight: 700; }
    .bs    { font-size: 11px; }
    .it    { font-size: 12px; font-weight: 600; }
    .lbl   { font-size: 11.5px; font-weight: 600; }
    .note  { font-size: 11px; font-style: italic; }
    .txt   { fill: #16181d; }
    .muted { fill: #5b6470; }
    .ink   { stroke: #16181d; }
    .divi  { stroke: #5b6470; }
    @media (prefers-color-scheme: dark) {
      .txt   { fill: #e9ecf1; }
      .muted { fill: #9aa2ad; }
      .ink   { stroke: #e9ecf1; }
      .divi  { stroke: #9aa2ad; }
    }
    :root[data-theme="dark"] .txt   { fill: #e9ecf1; }
    :root[data-theme="dark"] .muted { fill: #9aa2ad; }
    :root[data-theme="dark"] .divi  { stroke: #9aa2ad; }
    :root[data-theme="light"] .txt  { fill: #16181d; }
    :root[data-theme="light"] .muted{ fill: #5b6470; }
    :root[data-theme="light"] .divi { stroke: #5b6470; }
  </style>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e0913a"/>
    </marker>
    <marker id="gg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3fa34d"/>
    </marker>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2a9d8f"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="title txt" x="490" y="34" text-anchor="middle">Hệ hỗn hợp Oracle–MariaDB–PostgreSQL–MSSQL</text>
  <text class="sub muted" x="490" y="56" text-anchor="middle">Đồng bộ (Data Guard · GoldenGate) — Đối soát (Veridata) — Di trú sang cụm server mới</text>

  <!-- ===== FLOWS (orthogonal, drawn first, under boxes) ===== -->
  <!-- Data Guard: OPRI -> OSTBA (elbow, left) -->
  <path d="M430,162 V205 H148 V300" fill="none" stroke="#e0913a" stroke-width="2.4" marker-end="url(#ag)"/>
  <text class="lbl" x="289" y="197" text-anchor="middle" fill="#e0913a">Data Guard · redo</text>

  <!-- GoldenGate hub: OPRI -> bus -> 3 satellites -->
  <path d="M490,162 V245 M365,245 H775" fill="none" stroke="#3fa34d" stroke-width="2.4"/>
  <circle cx="490" cy="245" r="3.2" fill="#3fa34d"/>
  <path d="M365,245 V300" fill="none" stroke="#3fa34d" stroke-width="2.4" marker-end="url(#gg)"/>
  <path d="M565,245 V300" fill="none" stroke="#3fa34d" stroke-width="2.4" marker-end="url(#gg)"/>
  <path d="M775,245 V300" fill="none" stroke="#3fa34d" stroke-width="2.4" marker-end="url(#gg)"/>
  <text class="lbl" x="600" y="197" text-anchor="middle" fill="#3fa34d">GoldenGate Hub · CDC (heterogeneous)</text>

  <!-- Veridata verify: OPRI <-> MSSQL (dashed, orthogonal) -->
  <path d="M630,125 H955 V495 H922" fill="none" stroke="#9b59b6" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M775,376 V470" fill="none" stroke="#9b59b6" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- ===== BOXES ===== -->
  <!-- Oracle Primary -->
  <rect x="350" y="88" width="280" height="74" rx="9" fill="#c74634" fill-opacity="0.16" stroke="#c74634" stroke-width="2"/>
  <text class="bt txt"   x="490" y="112" text-anchor="middle">Oracle Primary · OPRI (.21)</text>
  <text class="bs muted" x="490" y="130" text-anchor="middle">schema FINACC — nguồn dữ liệu tài chính</text>
  <text class="bs muted" x="490" y="147" text-anchor="middle">+ OGG Hub (Extract capture)</text>

  <!-- Oracle Standby -->
  <rect x="45" y="300" width="205" height="76" rx="9" fill="#e0913a" fill-opacity="0.16" stroke="#e0913a" stroke-width="2"/>
  <text class="bt txt"   x="147" y="326" text-anchor="middle">Oracle Standby · OSTBA (.22)</text>
  <text class="bs muted" x="147" y="345" text-anchor="middle">Data Guard — physical standby</text>
  <text class="bs muted" x="147" y="362" text-anchor="middle">HA / dự phòng (lag 0)</text>

  <!-- MariaDB -->
  <rect x="290" y="300" width="150" height="76" rx="9" fill="#b8743d" fill-opacity="0.18" stroke="#b8743d" stroke-width="2"/>
  <text class="bt txt"   x="365" y="332" text-anchor="middle">MariaDB (.21)</text>
  <text class="bs muted" x="365" y="352" text-anchor="middle">Docker · vệ tinh</text>

  <!-- PostgreSQL -->
  <rect x="490" y="300" width="150" height="76" rx="9" fill="#336791" fill-opacity="0.20" stroke="#4a86b8" stroke-width="2"/>
  <text class="bt txt"   x="565" y="332" text-anchor="middle">PostgreSQL (.22)</text>
  <text class="bs muted" x="565" y="352" text-anchor="middle">Docker · vệ tinh</text>

  <!-- MS SQL Server -->
  <rect x="690" y="300" width="170" height="76" rx="9" fill="#cc2927" fill-opacity="0.16" stroke="#cc2927" stroke-width="2"/>
  <text class="bt txt"   x="775" y="332" text-anchor="middle">MS SQL Server (.23)</text>
  <text class="bs muted" x="775" y="352" text-anchor="middle">Windows · Developer · vệ tinh</text>

  <!-- Veridata -->
  <rect x="628" y="470" width="294" height="70" rx="9" fill="#9b59b6" fill-opacity="0.16" stroke="#9b59b6" stroke-width="2"/>
  <text class="bt txt"   x="775" y="496" text-anchor="middle">Veridata (.22)</text>
  <text class="bs muted" x="775" y="515" text-anchor="middle">verify Oracle ↔ MS SQL row-by-row</text>
  <text class="bs" x="775" y="532" text-anchor="middle" fill="#9b59b6" font-weight="700">→ 0 out-of-sync</text>

  <!-- manual compare note -->
  <text class="note muted" x="365" y="410" text-anchor="middle">⚠ MariaDB / PostgreSQL: đối soát thủ công bằng SQL</text>
  <text class="note muted" x="365" y="426" text-anchor="middle">(Veridata 12.2.1.4 không hỗ trợ 2 loại này)</text>

  <!-- ===== LEGEND (Phần 1–3) ===== -->
  <line x1="70" y1="574" x2="104" y2="574" stroke="#e0913a" stroke-width="3"/>
  <text class="lbl txt" x="112" y="578" text-anchor="start">Data Guard — đồng bộ dự phòng</text>

  <line x1="360" y1="574" x2="394" y2="574" stroke="#3fa34d" stroke-width="3"/>
  <text class="lbl txt" x="402" y="578" text-anchor="start">GoldenGate — đồng bộ khai thác</text>

  <line x1="670" y1="574" x2="704" y2="574" stroke="#9b59b6" stroke-width="3" stroke-dasharray="6 5"/>
  <text class="lbl txt" x="712" y="578" text-anchor="start">Veridata — đối soát tự động</text>

  <!-- ===== DIVIDER ===== -->
  <line class="divi" x1="45" y1="606" x2="935" y2="606" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.55"/>

  <!-- ===== PHẦN 4 — DI TRÚ ===== -->
  <text class="h2 txt"   x="490" y="636" text-anchor="middle">Phần 4 — Di trú sang cụm server mới</text>
  <text class="sub muted" x="490" y="656" text-anchor="middle">dựng bản sao song song → cutover → bỏ cụm cũ</text>

  <!-- Group: cụm server hiện tại -->
  <rect x="55" y="676" width="340" height="214" rx="10" fill="none" class="divi" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/>
  <text class="lbl muted" x="225" y="698" text-anchor="middle">Cụm server hiện tại — .21 / .22 / .23</text>

  <rect x="75" y="710" width="300" height="36" rx="7" fill="#c74634" fill-opacity="0.14" stroke="#c74634" stroke-width="1.6"/>
  <text class="it txt" x="225" y="733" text-anchor="middle">Oracle OPRI (.21) · OSTBA (.22)</text>

  <rect x="75" y="754" width="300" height="36" rx="7" fill="#b8743d" fill-opacity="0.16" stroke="#b8743d" stroke-width="1.6"/>
  <text class="it txt" x="225" y="777" text-anchor="middle">MariaDB (.21) — Docker</text>

  <rect x="75" y="798" width="300" height="36" rx="7" fill="#336791" fill-opacity="0.18" stroke="#4a86b8" stroke-width="1.6"/>
  <text class="it txt" x="225" y="821" text-anchor="middle">PostgreSQL (.22) — Docker</text>

  <rect x="75" y="842" width="300" height="36" rx="7" fill="#cc2927" fill-opacity="0.14" stroke="#cc2927" stroke-width="1.6"/>
  <text class="it txt" x="225" y="865" text-anchor="middle">MS SQL Server (.23)</text>

  <!-- Group: cụm server mới -->
  <rect x="585" y="676" width="340" height="214" rx="10" fill="#2a9d8f" fill-opacity="0.06" stroke="#2a9d8f" stroke-width="1.8"/>
  <text class="lbl" x="755" y="698" text-anchor="middle" fill="#2a9d8f" font-weight="700">Cụm server mới — .31 / .32 / .33</text>

  <rect x="605" y="710" width="300" height="36" rx="7" fill="#c74634" fill-opacity="0.14" stroke="#c74634" stroke-width="1.6"/>
  <text class="it txt" x="755" y="733" text-anchor="middle">Oracle NPRI (.31) · NSTB (.32)</text>

  <rect x="605" y="754" width="300" height="36" rx="7" fill="#b8743d" fill-opacity="0.16" stroke="#b8743d" stroke-width="1.6"/>
  <text class="it txt" x="755" y="777" text-anchor="middle">MariaDB (.31) — Docker</text>

  <rect x="605" y="798" width="300" height="36" rx="7" fill="#336791" fill-opacity="0.18" stroke="#4a86b8" stroke-width="1.6"/>
  <text class="it txt" x="755" y="821" text-anchor="middle">PostgreSQL (.32) — Docker</text>

  <rect x="605" y="842" width="300" height="36" rx="7" fill="#cc2927" fill-opacity="0.14" stroke="#cc2927" stroke-width="1.6"/>
  <text class="it txt" x="755" y="865" text-anchor="middle">MS SQL Server (.33)</text>

  <!-- Migration arrows -->
  <path d="M400,728 H578" fill="none" stroke="#2a9d8f" stroke-width="2.2" marker-end="url(#mg)"/>
  <text class="lbl" x="490" y="722" text-anchor="middle" fill="#2a9d8f">SWITCHOVER TO NPRI</text>

  <path d="M400,772 H578" fill="none" stroke="#2a9d8f" stroke-width="2.2" marker-end="url(#mg)"/>
  <text class="lbl" x="490" y="766" text-anchor="middle" fill="#2a9d8f">native replication</text>

  <path d="M400,816 H578" fill="none" stroke="#2a9d8f" stroke-width="2.2" marker-end="url(#mg)"/>
  <text class="lbl" x="490" y="810" text-anchor="middle" fill="#2a9d8f">streaming replication</text>

  <path d="M400,860 H578" fill="none" stroke="#2a9d8f" stroke-width="2.2" marker-end="url(#mg)"/>
  <text class="lbl" x="490" y="854" text-anchor="middle" fill="#2a9d8f">backup / restore</text>

  <!-- Part 4 footnote -->
  <text class="note muted" x="490" y="916" text-anchor="middle">OGG Hub dựng lại trên .31 (Extract capture NPRI → 3 Replicat) · Veridata dựng lại trên .32 — rồi tắt hẳn .21 / .22 / .23</text>
</svg>
